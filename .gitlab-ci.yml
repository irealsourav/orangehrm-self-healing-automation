# Runs against the OrangeHRM demo. Code stays primary on GitHub; a GitHub
# Actions workflow (.github/workflows/mirror-to-gitlab.yml) pushes every
# commit here, which is what triggers this pipeline (GitLab.com's own pull
# mirroring is Premium/Ultimate-only, so we push instead of having GitLab pull).
#
# Image ships Chromium/Firefox/WebKit pre-installed, matching the
# @playwright/test version pinned in package-lock.json — keep the tag in sync
# whenever that version bumps (Playwright refuses to run against mismatched
# browsers).
image: mcr.microsoft.com/playwright:v1.63.0-jammy

stages:
  - install
  - verify
  - test
  - report

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm-cache"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm-cache/

install:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: verify
  needs: ["install"]
  script:
    - npm run lint

typecheck:
  stage: verify
  needs: ["install"]
  script:
    - npm run typecheck

# Sharding (Playwright's native --shard, via GitLab's `parallel:` keyword)
# is the intended lever for keeping suite wall-clock time flat as the
# jira-test-to-playwright / new-page-object skills add hundreds more tests —
# deliberately not used right now, matching playwright.config.ts's
# `workers: 1`. Confirmed by direct A/B testing, not assumed: 2 concurrent
# sessions against the shared PUBLIC demo (2 local workers, and separately
# 2 CI shards) caused tests that are rock solid alone — e.g. Add Employee's
# save+redirect — to start failing, purely from the concurrency itself, not
# general slowness. Bring back `parallel: N` + `--shard=$CI_NODE_INDEX/
# $CI_NODE_TOTAL` only once tests run against a self-hosted instance
# (Stage B in docs/LOCATOR_LIFECYCLE.md) instead of the public demo — that's
# the actual fix for real parallelism, not a bigger number here.
e2e:
  stage: test
  needs: ["install"]
  script:
    - npx playwright test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - blob-report/
      - test-results/
    reports:
      junit: test-results/junit.xml

# Combines every shard's blob report into the one HTML report a human
# actually wants to look at. `needs: ["e2e"]` on a parallelized job pulls in
# the artifacts from *all* of its shards, not just one.
merge-report:
  stage: report
  needs: ["e2e"]
  script:
    - npx playwright merge-reports --reporter=html ./blob-report
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
